name: Release lockfile

# release-please bumps the version in pyproject.toml but not in uv.lock, which breaks
# `uv sync --locked` in CI. Whenever release-please pushes its branch, re-lock and push.
on:
  push:
    branches: ["release-please--**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Sync uv.lock
    if: startsWith(github.ref_name, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Pushing with a PAT (not GITHUB_TOKEN) makes CI run on the updated release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv lock
      - name: Commit lockfile if it changed
        run: |
          if git diff --quiet uv.lock; then
            echo "uv.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync uv.lock with release version"
          git push
