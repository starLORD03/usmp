name: PR title

# The PR title becomes the squash-merge commit, which drives the changelog and version.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            ci
            chore
            refactor
            perf
            build
            revert
          requireScope: false
          # Subject case is not enforced, so Dependabot titles ("ci: Bump …") pass.
