[project]
name = "usmp-protocol"
version = "0.1.0"
description = "Universal Service Migration Protocol: move your data between services and platforms without losing it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "starLORD03" }]
requires-python = ">=3.11"
keywords = ["migration", "data-portability", "calendar", "caldav", "interoperability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "caldav>=1.4",
    "icalendar>=6.1",
    "keyring>=25",
    "pydantic>=2.8",
    "rich>=13",
    "typer>=0.12",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/starLORD03/usmp"
Issues = "https://github.com/starLORD03/usmp/issues"
Changelog = "https://github.com/starLORD03/usmp/blob/main/CHANGELOG.md"

[project.scripts]
usmp = "usmp.cli.app:main"

[project.entry-points."usmp.connectors"]
google = "usmp.connectors.gcal:GoogleCalendarConnector"
caldav = "usmp.connectors.caldav:CalDavConnector"
ics = "usmp.connectors.ics:IcsConnector"
jsondir = "usmp.connectors.jsondir:JsonDirConnector"
memory = "usmp.connectors.memory:MemoryConnector"

[project.optional-dependencies]
google = [
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "hypothesis>=6.100",
    "jsonschema>=4.23",
    "types-jsonschema>=4.26.0.20261006",
    "radicale>=3.2",
    "responses>=0.25",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
    "types-requests>=2.33.0.20261030",
]
docs = [
    "zensical>=0.1.3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usmp"]

# --- Tooling -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "S",        # bandit (security)
    "PTH",      # use pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["usmp"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
